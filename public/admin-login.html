<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    ELOC Aviator Predictor — Administrator Login
  </title>

  <link
    rel="stylesheet"
    href="/css/login.css"
  >
</head>

<body>

  <!-- 01. Administrator Login Container -->

  <main class="login-container">

    <section class="login-card">

      <div class="brand">

        <h1>
          ELOC Aviator Predictor
        </h1>

        <p>
          Administrator Portal
        </p>

      </div>

      <!-- 02. Administrator Login Form -->

      <form id="adminLoginForm">

        <div class="form-group">

          <label for="adminEmail">
            Administrator Email
          </label>

          <input
            id="adminEmail"
            name="email"
            type="email"
            autocomplete="username"
            placeholder="Enter administrator email"
            required
          >

        </div>

        <div class="form-group">

          <label for="adminPassword">
            Password
          </label>

          <input
            id="adminPassword"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter administrator password"
            required
          >

        </div>

        <!-- 03. Error Message -->

        <div
          id="adminLoginError"
          class="login-error"
          role="alert"
          hidden
        ></div>

        <!-- 04. Login Button -->

        <button
          id="adminLoginButton"
          type="submit"
        >
          Administrator Login
        </button>

      </form>

      <!-- 05. Navigation -->

      <div class="registration-link">

        <p>
          <a href="/">
            Back to User Login
          </a>
        </p>

      </div>

    </section>

  </main>

  <!-- 06. Administrator Login JavaScript -->

  <script src="/js/admin-login.js"></script>

</body>
</html>
